<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISLAMIC REPUBLIC OF IRAN</title>
<style>
:root{--ink:#101820;--muted:#687386;--line:#e5e9ef;--green:#16845b}*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:var(--ink);font-family:Tahoma,Arial,sans-serif}.hero{background:linear-gradient(125deg,#101820,#263747);color:#fff;padding:35px 18px 31px;text-align:center;border-bottom:4px solid #16845b}.hero h1{font:700 clamp(22px,4vw,34px) Arial,sans-serif;letter-spacing:1px;margin:0 0 9px}.hero p{margin:0;color:#cbd5df;font-size:13px;letter-spacing:2px}.wrap{max-width:760px;margin:28px auto;padding:0 15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:17px;box-shadow:0 7px 24px #14223508}.tabs{display:flex;gap:8px;margin-bottom:17px}.tab{flex:1;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:12px;font:inherit;cursor:pointer}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}h2{font-size:18px;margin:0 0 17px}label{display:block;font-size:13px;font-weight:bold;margin:13px 0 7px}input{width:100%;padding:13px;border:1px solid #d8dee7;border-radius:10px;font:inherit;background:#fff}input[type=file]{padding:10px}button{border:0;border-radius:10px;padding:13px 17px;background:var(--green);color:#fff;font:inherit;font-weight:bold;cursor:pointer;width:100%;margin-top:14px}button.secondary{background:#273747}button.danger{background:#a52e36;width:auto;padding:8px 12px;margin:0}.hint,.muted{color:var(--muted);font-size:12px;line-height:1.9}.result{text-align:center;margin-top:18px}.result img{max-width:260px;width:100%;border:1px solid var(--line);padding:8px;border-radius:12px}.link{direction:ltr;word-break:break-all;color:#146caa;font-size:13px}.hidden{display:none!important}.message{padding:11px;border-radius:9px;margin-top:12px;font-size:13px;line-height:1.8}.error{background:#fff0f0;color:#a52e36}.success{background:#ecf9f2;color:#176b47}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--muted);margin-top:5px}.footer{text-align:center;color:#87909d;font:11px Arial,sans-serif;padding:10px 0 28px;letter-spacing:1px}
</style></head>
<body>
<header class="hero"><h1>ISLAMIC REPUBLIC OF IRAN</h1><p>IMAGE TO QR CODE SERVICE</p></header>
<main class="wrap">
<div class="card">
<div class="tabs"><button class="tab active" id="searchTab" type="button">جست‌وجوی سریال</button><button class="tab" id="adminTab" type="button">مدیریت و آپلود</button></div>
<section id="searchPanel"><h2>مشاهده تصویر با سریال</h2><label for="searchSerial">شماره سریال تصویر</label><input id="searchSerial" placeholder="سریال را وارد کنید" autocomplete="off"><button id="searchBtn">نمایش تصویر</button><div id="searchMessage"></div><div id="searchResult" class="result hidden"></div></section>
<section id="adminPanel" class="hidden"><div id="loginBox"><h2>ورود مدیر</h2><label for="password">رمز عبور مدیریت</label><input id="password" type="password" placeholder="رمز عبور"><button id="loginBtn">ورود</button><div id="loginMessage"></div></div>
<div id="uploadBox" class="hidden"><h2>آپلود تصویر و ساخت QR Code</h2><p class="hint">سریال را دستی انتخاب کنید. QR Code به صفحه نمایش همان تصویر وصل می‌شود و ۱۴ روز اعتبار دارد.</p><form id="uploadForm"><label for="serial">سریال تصویر</label><input id="serial" name="serial" required maxlength="40" placeholder="مثلاً IR-1001"><label for="image">انتخاب تصویر (حداکثر ۱۰ مگابایت)</label><input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><button id="uploadBtn">آپلود و ساخت QR Code</button></form><div id="uploadMessage"></div><div id="qrResult" class="result hidden"></div><hr style="border:0;border-top:1px solid #e5e9ef;margin:22px 0"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">تصاویر فعال</h2><button id="refreshBtn" class="secondary" style="width:auto;margin:0">به‌روزرسانی</button></div><div id="imageList" class="hint" style="margin-top:10px"></div><button id="logoutBtn" class="secondary">خروج از مدیریت</button></div></section>
</div><p class="footer">ISLAMIC REPUBLIC OF IRAN · 14-DAY TEMPORARY IMAGE LINKS</p>
</main>
<script>
const $=id=>document.getElementById(id);const show=(id,on=true)=>$(id).classList.toggle('hidden',!on);function msg(id,text,type='error'){ $(id).innerHTML=text?`<div class="message ${type}">${text}</div>`:''; }
$('searchTab').onclick=()=>{ $('searchTab').classList.add('active');$('adminTab').classList.remove('active');show('searchPanel');show('adminPanel',false)};
$('adminTab').onclick=()=>{ $('adminTab').classList.add('active');$('searchTab').classList.remove('active');show('adminPanel');show('searchPanel',false)};
$('searchBtn').onclick=async()=>{const s=$('searchSerial').value.trim();if(!s)return msg('searchMessage','سریال را وارد کنید.');show('searchResult',false);msg('searchMessage','در حال جست‌وجو...','success');try{const r=await fetch('/api/search/'+encodeURIComponent(s));const d=await r.json();if(!r.ok)throw Error(d.error);msg('searchMessage','تصویر پیدا شد.','success');$('searchResult').innerHTML=`<img src="${d.imageUrl}" alt="تصویر"><p class="muted">سریال: ${d.serial}</p><p class="muted">اعتبار تا: ${new Date(d.expiresAt).toLocaleString('fa-IR')}</p>`;show('searchResult')}catch(e){msg('searchMessage',e.message)}};
$('loginBtn').onclick=async()=>{try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);show('loginBox',false);show('uploadBox');loadImages()}catch(e){msg('loginMessage',e.message)}};
$('uploadForm').onsubmit=async e=>{e.preventDefault();$('uploadBtn').disabled=true;$('uploadBtn').textContent='در حال آپلود...';msg('uploadMessage','');try{const r=await fetch('/api/upload',{method:'POST',body:new FormData($('uploadForm'))});const d=await r.json();if(!r.ok)throw Error(d.error);$('qrResult').innerHTML=`<h2>QR Code آماده است</h2><img src="${d.qrDataUrl}" alt="QR Code"><p class="muted">سریال: ${d.serial}</p><p class="link">${d.viewUrl}</p><p class="muted">اعتبار تا: ${new Date(d.expiresAt).toLocaleString('fa-IR')}</p><a href="${d.qrDataUrl}" download="QR-${d.serial}.png"><button type="button" class="secondary">دریافت تصویر QR Code</button></a>`;show('qrResult');msg('uploadMessage','تصویر با موفقیت ذخیره شد.','success');$('uploadForm').reset();loadImages()}catch(e){msg('uploadMessage',e.message)}finally{$('uploadBtn').disabled=false;$('uploadBtn').textContent='آپلود و ساخت QR Code'}};
async function loadImages(){const r=await fetch('/api/admin/images');if(r.status===401)return;const a=await r.json();$('imageList').innerHTML=a.length?a.map(x=>`<div class="row"><div><b>${x.serial}</b><small>انقضا: ${new Date(x.expiresAt).toLocaleString('fa-IR')}</small><a class="link" href="${x.viewUrl}" target="_blank">مشاهده لینک</a></div><button class="danger" onclick="deleteImage('${encodeURIComponent(x.serial)}')">حذف</button></div>`).join(''):'تصویر فعالی وجود ندارد.'}
window.deleteImage=async s=>{if(!confirm('این تصویر حذف شود؟'))return;const r=await fetch('/api/admin/images/'+s,{method:'DELETE'});const d=await r.json();if(!r.ok)return alert(d.error);loadImages()};$('refreshBtn').onclick=loadImages;$('logoutBtn').onclick=async()=>{await fetch('/api/logout',{method:'POST'});show('uploadBox',false);show('loginBox');$('password').value=''};
fetch('/api/session').then(r=>r.json()).then(d=>{if(d.loggedIn){show('loginBox',false);show('uploadBox');loadImages()}});
</script></body></html>
